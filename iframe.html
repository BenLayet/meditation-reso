<div class="richedit_wrap" style="">
  <div class="richedit_wrap" style="background-color: rgb(0, 0, 0)" id="iframe-container">
    <iframe
      src="https://benlayet.github.io/meditation-reso/?v=3"
      allow="fullscreen; screen-wake-lock"
      allowfullscreen="allowfullscreen"
      style="
      width: 100%;
      border: none;
      border-radius: 3px;
      min-height: 700px;
      background-color: rgb(0, 0, 0);
    "
    ></iframe>
    <script prevent-tag-removal="">
      let wakeLock = null;

      async function requestWakeLock() {
        try {
          if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
            console.log("Wake Lock activated");
            return wakeLock;
          }
        } catch (err) {
          console.error("Wake Lock failed:", err);
        }
      }

      async function releaseWakeLock() {
        if (wakeLock) {
          try {
            await wakeLock.release();
            wakeLock = null;
            console.log("Wake Lock released");
          } catch (err) {
            console.error("Wake Lock release failed:", err);
          }
        }
      }
      const iFrameContainer = document.getElementById('iframe-container');
      if(iFrameContainer){
        // Release wake lock when iFrameContainer is hidden/unloaded
        iFrameContainer.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") {
            releaseWakeLock();
          }else {
            requestWakeLock();
          }
        });
      }else{
        console.error("iFrameContainer not found");
      }
    </script>
  </div>
</div>
