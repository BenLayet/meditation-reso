<div class="richedit_wrap" style="">
  <div class="richedit_wrap" style="background-color: rgb(0, 0, 0)" >
    <iframe id="meditation-reso-iframe"
      src="https://benlayet.github.io/meditation-reso/?v=3"
      allow="fullscreen; screen-wake-lock; "
      allowfullscreen="allowfullscreen"
      style="
      width: 100%;
      border: none;
      border-radius: 3px;
      min-height: 700px;
      background-color: rgb(0, 0, 0);
    "
    ></iframe>
    <script prevent-tag-removal="">
    window.addEventListener('message', (e) => {
      console.log(`message received`, e);
      if (!e.origin.startsWith('https://benlayet.github.io')) return; // validate
      const { id, type, key, value } = e.data || {};
      if (type === 'get') {
        const val = localStorage.getItem(key); // or read cookie
        e.source.postMessage({ id, type: 'response', value: val }, e.origin);
      } else if (type === 'set') {
        localStorage.setItem(key, value);
        e.source.postMessage({ id, type: 'response', value: "ok" }, e.origin);
      }
    });
    </script>
  </div>
</div>
