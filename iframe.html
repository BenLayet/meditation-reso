<div class="richedit_wrap" style="">
  <div class="richedit_wrap" style="background-color: rgb(0, 0, 0)" >
    <iframe id="meditation-reso-iframe"
      src="https://benlayet.github.io/meditation-reso/?v=3"
      allow="fullscreen; screen-wake-lock; "
      allowfullscreen="allowfullscreen"
      style="
      width: 100%;
      border: none;
      border-radius: 3px;
      min-height: 700px;
      background-color: rgb(0, 0, 0);
    "
    ></iframe>
    <script prevent-tag-removal="">
      const prefix = 'MEDITATION_TIMER_RESO_';
    window.addEventListener('message', (message) => {
      if (!message.origin.startsWith('https://benlayet.github.io')) return; // validate
      console.debug(message);
      const { id, type, key, value } = message.data || {};
      if (type === 'get') {
        const val = localStorage.getItem(prefix + key);

        message.source.postMessage({ id, type: 'response', value: val }, {targetOrigin: message.origin });
      } else if (type === 'set') {
        localStorage.setItem(prefix + key, value);
        message.source.postMessage({ id, type: 'response', value: "ok" }, {targetOrigin: message.origin });
      }
    });
    </script>
  </div>
</div>
