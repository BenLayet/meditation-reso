<div class="richedit_wrap" style="">
  <div class="richedit_wrap" style="background-color: rgb(0, 0, 0)">
    <iframe
      id="meditation-reso-iframe"
      src="https://benlayet.github.io/meditation-reso/?v=3"
      allow="fullscreen; screen-wake-lock; autoplay;"
      allowfullscreen="allowfullscreen"
      style="
        width: 100%;
        border: none;
        border-radius: 3px;
        min-height: 700px;
        background-color: rgb(0, 0, 0);
      "
    ></iframe>
    <script src="https://unpkg.com/nosleep.js/dist/NoSleep.min.js"></script>
    <script prevent-tag-removal="">
      const prefix = "MEDITATION_TIMER_RESO_";
      const origin = "https://benlayet.github.io";

      window.addEventListener("message", async message => {
        if (!message.origin.startsWith(origin)) return;
        console.debug(`${prefix} message received in parent `, message);
        const { id, type, key, value } = message.data || {};
        let responseValue = "";
        switch (type) {
          case "get":
            responseValue = get(key);
            break;
          case "set":
            set(key, value);
            break;
          case "requestWakeLock":
            await requestWakeLock();
            break;
          case "releaseWakeLock":
            await releaseWakeLock();
            break;
          default:
            console.error(`${prefix} unsupported message type=${type}`);
            return;
        }
        console.debug(`${prefix} response from parent:`, responseValue);
        message.source.postMessage(
          { id, type: "response", value: responseValue },
          { targetOrigin: message.origin },
        );
      });
      function get(key) {
        return getCookie(prefix + key);
      }
      function set(key, value) {
        setCookie(prefix + key, value);
      }

      function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(";");
        for (let c of ca) {
          while (c.startsWith(" ")) c = c.substring(1, c.length);
          if (c.startsWith(nameEQ))
            return decodeURIComponent(c.substring(nameEQ.length, c.length));
        }
        return null;
      }

      function setCookie(name, value) {
        const seconds = 365 * 24 * 60 * 60; // 1 year
        const maxAgePart = `; max-age=${seconds}`;
        const expires = `; expires=${new Date(Date.now() + seconds * 1000).toUTCString()}`;
        document.cookie =
          name +
          "=" +
          encodeURIComponent(value || "") +
          maxAgePart +
          expires +
          "; domain=.reso.co; path=/; SameSite=None; Secure";
      }

      let wakeLock = null;
      const noSleep = new NoSleep();
      async function requestWakeLock() {
        try {
          // NoSleep.enable() will create/play a small muted inline video
          // Must be a user gesture — click/tap
          noSleep.enable();
          console.log(`${prefix} NoSleep enabled`);
        } catch (err) {
          console.error(`${prefix} NoSleep enable failed`, err);
        }
        try {
          if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
            console.log(`${prefix} Wake Lock activated`);
            return wakeLock;
          }
        } catch (err) {
          console.error(`${prefix} Wake Lock failed:`, err);
        }
      }

      async function releaseWakeLock() {
        try {
          // NoSleep.enable() will create/play a small muted inline video
          // Must be a user gesture — click/tap
          noSleep.disable();
          console.log(`${prefix} NoSleep disabled`);
        } catch (err) {
          console.error(`${prefix} NoSleep disable failed`, err);
        }
        if (wakeLock) {
          try {
            await wakeLock.release();
            wakeLock = null;
            console.log(`${prefix} Wake Lock released`);
          } catch (err) {
            console.error(`${prefix} Wake Lock release failed:`, err);
          }
        }
      }
    </script>
  </div>
</div>
